[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-assistant"
version = "0.1.0"
description = "Grounded musical instrument store assistant"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7", "tzdata>=2025.1; sys_platform == 'win32'"]

[project.optional-dependencies]
pdf = ["reportlab>=4,<5"]

[project.scripts]
emporio = "emporio.cli:main"

[tool.setuptools]
packages = ["emporio"]
